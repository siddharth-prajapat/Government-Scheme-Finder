<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goverment Scheme Finder</title>
    <link rel="icon"  href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="heading"> <marquee behavior="" direction=""> <h1>Government Scheme Finder</h1></marquee></header>
    
        <div id="form">
            <h3 id="head">Fill the Form</h3>
            <input id="age" type="text" placeholder="Enter your age">
            <input id="income" type="text"  placeholder="Enter Your Yearly income">
           
            <select id="category">
                <option value="">Select category</option>
                <option value="STSC">STSC</option>
                  <option value="General">General</option>
                    <option value="OBC">OBC</option>
            </select>
            <!-- <input id="category" type="text" placeholder="Enter Your Category"> -->
            <input id="state" type="text" placeholder=" Enter your State">
            <button id="button">Submit</button>
        </div>
        <h2 id="display">Result Display</h2>
        <div id="result">
            <p>Results Will be displayed here</p>
        </div>
        
    <script src="script.js"></script>
</body>
</html>
